name: Opcodex build and draft release
on:
  push:
    branches: [master, main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      create_draft:
        description: Create a draft release after all platform builds and tests pass
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: opcodex-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux_x86_64
          - os: windows-2022
            platform: win_x86_64
          - os: macos-15
            platform: mac_arm_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Release-boundary tests
        run: python -m unittest discover -s opcodex/tests -v
      - name: Fetch pinned engine dependencies (Unix)
        if: runner.os != 'Windows'
        run: ./gradlew --no-daemon -I gradle/support/fetchDependencies.gradle -DhideDownloadProgress=true
      - name: Fetch pinned engine dependencies (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat --no-daemon -I gradle/support/fetchDependencies.gradle -DhideDownloadProgress=true
      - name: Build native Opcodex package (Unix)
        if: runner.os != 'Windows'
        run: ./gradlew --no-daemon buildOpcodex
      - name: Build native Opcodex package (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat --no-daemon buildOpcodex
      - name: Upstream unit tests (Linux desktop)
        if: runner.os == 'Linux'
        run: xvfb-run -a ./gradlew --no-daemon unitTestReport
      - name: Upload native package and provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opcodex-${{ matrix.platform }}
          path: build/releases/*
          if-no-files-found: error
          retention-days: 14
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ matrix.platform }}
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
  draft:
    name: Prepare reviewed-release draft
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_draft)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: opcodex-*
          merge-multiple: true
          path: release-assets
      - name: Validate source version and downloaded assets
        id: version
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          from opcodex.package_release import properties
          version = properties(pathlib.Path('Ghidra/application.properties').read_text())['opcodex.version']
          tag = 'v' + version
          if os.environ['GITHUB_REF'].startswith('refs/tags/'):
              assert os.environ['GITHUB_REF_NAME'] == tag, 'Tag and product version differ'
          assert (pathlib.Path('docs/releases') / (version + '.md')).is_file()
          files = list(pathlib.Path('release-assets').glob('*.zip'))
          assert len(files) == 3, 'Every native platform package is required'
          platforms = set()
          for file in files:
              with file.open('rb') as stream:
                  checksum = hashlib.file_digest(stream, 'sha256').hexdigest()
              assert checksum == file.with_suffix('.zip.sha256').read_text().split()[0]
              manifest = json.loads(file.with_suffix('.json').read_text())
              assert manifest['sourceRevision'] == os.environ['GITHUB_SHA']
              assert manifest['version'] == version and manifest['archiveSha256'] == checksum
              platforms.add(manifest['platform'])
          assert platforms == {'linux_x86_64', 'win_x86_64', 'mac_arm_64'}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('tag=' + tag + '\nversion=' + version + '\n')
          PY
      - name: Create draft with real native assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          PRODUCT_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          args=(--draft --title "Opcodex ${PRODUCT_VERSION}" --target "$GITHUB_SHA" --notes-file "docs/releases/${PRODUCT_VERSION}.md")
          if [[ "$PRODUCT_VERSION" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "${args[@]}" release-assets/*
