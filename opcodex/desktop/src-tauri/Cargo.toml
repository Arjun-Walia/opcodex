[package]
name = "opcodex-desktop"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Opcodex desktop shell: supervises the engine and hosts the interface and terminal."
publish = false

[[bin]]
name = "opcodex-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde_json = "1"
getrandom = "0.3"
portable-pty = "0.9"
dirs = "7"
keyring = { version = "3.6", features = ["windows-native"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "stream"] }
futures-util = "0.3"
url = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
